<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table and Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="nav-link">Task 1</a>
        <a href="task2.html" class="nav-link">Task 2</a>
        <a href="exercise1/index.html" class="nav-link">Task 3</a>
        <a href="task4.html" class="nav-link active">Task 4</a>
    </div>

    <div class="page-container">

        <h2 id="table-heading">Student Grade Report</h2>

        <table class="grades-table">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Damir</td>
                    <td>Web Development</td>
                    <td>92</td>
                </tr>
                <tr class="highlight-row">
                    <td>Rayimbek</td>
                    <td>Database Systems</td>
                    <td>98</td>
                </tr>
                <tr>
                    <td>Adel</td>
                    <td>Computer Networks</td>
                    <td>87</td>
                </tr>
                <tr>
                    <td colspan="2"><strong>Class Average</strong></td>
                    <td><strong>92.3</strong></td>
                </tr>
            </tbody>
        </table>

        <h2 style="text-align: center; margin-bottom: 20px;">Course Feedback Form</h2>

        <form class="feedback-form" id="user-feedback">
            <div class="form-group">
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="user-email">Email Address:</label>
                <input type="email" id="user-email" name="user-email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="user-role">Role:</label>
                <select id="user-role" name="user-role">
                    <option value="Student">Student</option>
                    <option value="Teacher">Teacher</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Did you find this lab useful?</label>
                <div class="radio-group">
                    <label><input type="radio" name="useful" value="Yes" checked> Yes</label>
                    <label><input type="radio" name="useful" value="No"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>

    </div>

</body>
</html>
